<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Unfollow Checker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 30px 15px; color: #1e293b; }
        .container { max-width: 1000px; margin: 0 auto; }
        .main-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; margin-bottom: 24px; overflow: hidden; }
        .header { background: #1e293b; color: white; padding: 32px; }
        .header h1 { font-size: 24px; font-weight: 700; margin-bottom: 20px; letter-spacing: -0.5px; }
        .upload-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .file-label { background: rgba(255,255,255,0.05); padding: 14px; border-radius: 6px; cursor: pointer; border: 1px dashed rgba(255,255,255,0.2); display: flex; flex-direction: column; font-size: 13px; transition: all 0.2s; }
        .file-label:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.5); }
        .file-label span.status { font-size: 11px; margin-top: 4px; opacity: 0.7; font-weight: bold; }
        .file-label input { display: none; }
        .btn-processar { background-color: #0ea5e9; color: white; border: none; padding: 12px 30px; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: background 0.2s; width: 100%; }
        .btn-processar:hover { background-color: #0284c7; }
        .btn-processar:disabled { background-color: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); cursor: not-allowed; }
        .stats-bar { display: flex; justify-content: space-around; background: #f8fafc; padding: 20px; border-bottom: 1px solid #e2e8f0; }
        .stat-box { text-align: center; flex: 1; }
        .stat-box:not(:last-child) { border-right: 1px solid #e2e8f0; }
        .stat-box .number { font-size: 24px; font-weight: 700; color: #0f172a; }
        .stat-box .label { font-size: 11px; color: #64748b; font-weight: 600; text-transform: uppercase; margin-top: 2px; }
        .toolbar { padding: 24px 32px; background: white; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 24px; display: flex; gap: 16px; align-items: center; }
        .search-input { flex: 1; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        .search-input:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15); }
        .btn-reset-history { background: #ef4444; color: white; border: none; padding: 10px 16px; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; }
        .btn-reset-history:hover { background: #dc2626; }
        .list-section-title { font-size: 14px; font-weight: 700; color: #475569; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .users-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .user-card { background: white; padding: 14px; border-radius: 8px; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .user-link { text-decoration: none; color: #0f172a; font-size: 14px; font-weight: 500; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .user-link:hover { color: #0ea5e9; }
        .btn-unfollow-action { background-color: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; padding: 6px 12px; font-size: 12px; font-weight: 600; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
        .btn-unfollow-action:hover { background-color: #fee2e2; color: #ef4444; border-color: #fca5a5; }
        .pagination-container { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .pagination-button { background: white; border: 1px solid #cbd5e1; color: #475569; padding: 8px 14px; font-size: 13px; font-weight: 600; border-radius: 6px; cursor: pointer; }
        .pagination-button:hover:not(:disabled) { border-color: #0ea5e9; color: #0ea5e9; }
        .pagination-button.active { background-color: #0ea5e9; border-color: #0ea5e9; color: white; }
        .pagination-button:disabled { opacity: 0.4; cursor: not-allowed; }
        .status-message { text-align: center; padding: 40px; color: #94a3b8; font-size: 14px; width: 100%; grid-column: 1 / -1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-card">
            <div class="header">
                <h1>Instagram Unfollow Checker</h1>
                <div class="upload-grid">
                    <label class="file-label">
                        <strong>Seguidores (followers_1.json)</strong>
                        <span id="status-followers" class="status">Checando pasta local...</span>
                        <input type="file" id="followersInput" accept=".json">
                    </label>
                    <label class="file-label">
                        <strong>Seguindo (following.json)</strong>
                        <span id="status-following" class="status">Checando pasta local...</span>
                        <input type="file" id="followingInput" accept=".json">
                    </label>
                </div>
                <button id="btnVerificar" class="btn-processar" disabled>Analisar Relações</button>
            </div>
            <div class="stats-bar">
                <div class="stat-box"><div class="number" id="count-followers">0</div><div class="label">Seguidores</div></div>
                <div class="stat-box"><div class="number" id="count-following">0</div><div class="label">Seguindo</div></div>
                <div class="stat-box"><div class="number" id="count-unfollow">0</div><div class="label">Não Te Seguem</div></div>
            </div>
        </div>
        <div class="toolbar">
            <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar usuário na lista..." disabled>
            <button id="btnResetHistory" class="btn-reset-history" style="display: none;">Limpar Histórico Local</button>
        </div>
        <div class="list-section-title" id="list-title">Lista de Perfis</div>
        <div class="users-grid" id="users-grid">
            <div class="status-message">Aguardando importação ou detecção automática dos arquivos JSON.</div>
        </div>
        <div class="pagination-container" id="pagination-controls"></div>
    </div>

    <script type="module" src="src/app.js"></script>
</body>
</html>
